<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LETHE-7</title>
<style>/*__STYLE__*/</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <div id="hud">
    <div id="toasts" aria-live="polite"></div>
    <div id="sector"></div>
    <div id="banner"></div>
    <div id="prompt"><span class="key">A</span><span class="txt"></span></div>
    <div id="hint"></div>
    <div id="dialog" aria-live="polite"><div class="who"></div><div class="text"></div><div class="choices"></div><div class="more"></div><div class="idx"></div></div>
    <canvas id="lowhp" width="160" height="90"></canvas>
  </div>
  <div id="screens"></div>
</div>
<div id="crt"></div>
<div id="boot">
  <div class="boot-inner">
    <div class="b-logo">LETHE-7</div>
    <div class="b-rule"></div>
    <div class="b-gloss">ЛЕТА-7 · CUSTODIAN STATION</div>
    <div class="b-click">CLICK TO BEGIN</div>
  </div>
  <div class="b-meta"><span>L7 CUSTODIAN OS 3.1</span><span>COLD START</span></div>
  <div class="b-warn">This game contains flashing images, sudden loud sounds and horror themes. Flashing can be reduced in Options. Headphones recommended.</div>
</div>
<script>/*__SCRIPT__*/</script>
</body>
</html>
